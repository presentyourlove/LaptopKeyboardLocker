name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Automated Unit Tests (>80% Coverage Gate)
        run: cmd /c run-tests.bat

      - name: Build Portable KeyLock.exe
        run: cmd /c build.bat

      - name: Verify KeyLock.exe CLI Emergency Unlock
        run: .\KeyLock.exe --unlock

      - name: Upload KeyLock.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyLock-Portable-x64
          path: KeyLock.exe

      - name: Publish or Update GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = "${{ github.ref_name }}"
          gh release view $tagName >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName KeyLock.exe --clobber
          } else {
            gh release create $tagName KeyLock.exe --generate-notes
          }
