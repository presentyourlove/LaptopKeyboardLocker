name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Native Git - Zero Node20 Deprecation Warnings)
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout -f FETCH_HEAD

      - name: Run Automated Unit Tests (>80% Coverage Gate)
        run: cmd /c run-tests.bat

      - name: Build Portable KeyLock.exe
        run: cmd /c build.bat

      - name: Verify KeyLock.exe CLI Emergency Unlock
        run: .\KeyLock.exe --unlock

      - name: Publish or Update GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = "${{ github.ref_name }}"
          gh release view $tagName >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName KeyLock.exe --clobber
          } else {
            gh release create $tagName KeyLock.exe --generate-notes
          }
